name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release binaries and checksums
        run: ./scripts/build-release.sh "${{ github.ref_name }}" dist

      - name: Verify checksums
        run: (cd dist && sha256sum -c checksums.txt)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/smidja-linux-amd64
            dist/smidja-linux-arm64
            dist/smidja-darwin-amd64
            dist/smidja-darwin-arm64
            dist/checksums.txt
          generate_release_notes: true
