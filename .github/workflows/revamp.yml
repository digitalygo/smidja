name: Manager and client
on:
  pull_request:
  push:
    branches: [feature/smidja-manager-client-revamp]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - run: go test -race -coverprofile=coverage.out ./internal/envai ./internal/managerstate ./internal/machinetools ./internal/machineclient ./internal/manager ./internal/managerpackages ./internal/privateconfig ./internal/extensiontools ./internal/clientpackages
      - run: go test -race -coverprofile=cli-coverage.out ./internal/cli -run 'Test(Manager|Client|Service|ReadService|Referenced|ValidateManager|BuildManager|RunManager|RunClient|ServeManager)'
      - run: python3 scripts/check-delta-coverage.py "${BASE_SHA:-origin/alpha}" coverage.out cli-coverage.out
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - run: go vet ./internal/envai ./internal/managerstate ./internal/machinetools ./internal/machineclient ./internal/manager ./internal/managerpackages ./internal/privateconfig ./internal/extensiontools ./internal/clientpackages
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - run: go build -o /tmp/smidja ./cmd/smidja
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
