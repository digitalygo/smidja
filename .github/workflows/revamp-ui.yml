name: Revamp UI
on:
  push:
    paths:
      - 'internal/manager/ui.go'
      - 'scripts/test-manager-*.mjs'
      - '.github/workflows/revamp-ui.yml'
  pull_request:
    paths:
      - 'internal/manager/ui.go'
      - 'scripts/test-manager-*.mjs'
      - '.github/workflows/revamp-ui.yml'
permissions:
  contents: read
jobs:
  embedded-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline DOM behavior checks
        run: node scripts/test-manager-ui.mjs
      - name: Install pinned browser test dependency
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Sandboxed browser smoke
        run: node scripts/test-manager-browser.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-browser-smoke
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
