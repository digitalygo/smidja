name: Verify existing release token tap write
on:
  push:
    branches: [diagnostic/smidja-release-token-20261031]
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'digitalygo/smidja' && github.ref == 'refs/heads/diagnostic/smidja-release-token-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify temporary tap ref and remove it
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request
          
          
          class NoRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          
          def run():
              token = os.environ.get("RELEASE_TOKEN", "")
              if not token:
                  print("RESULT: RELEASE_TOKEN is unavailable to this Smidja workflow")
                  return 2
              run_id = os.environ.get("GITHUB_RUN_ID", "")
              attempt = os.environ.get("GITHUB_RUN_ATTEMPT", "")
              if not run_id.isdigit() or not attempt.isdigit():
                  print("RESULT: invalid workflow execution identity")
                  return 3
              root = "https://api.github.com/repos/digitalygo/homebrew-smidja"
              branch = "smidja-token-probe-" + run_id + "-" + attempt
              ref_path = "/git/refs/heads/" + branch
              opener = urllib.request.build_opener(NoRedirects())
          
              def request(method, path, payload=None):
                  data = None if payload is None else json.dumps(payload).encode()
                  req = urllib.request.Request(root + path, data=data, method=method, headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "smidja-release-token-write-probe",
                      "Content-Type": "application/json",
                  })
                  try:
                      with opener.open(req, timeout=20) as response:
                          body = response.read(1048577)
                          if len(body) > 1048576:
                              raise ValueError("response limit")
                          return response.status, json.loads(body) if body else None
                  except urllib.error.HTTPError as error:
                      status = error.code
                      error.close()
                      return status, None
          
              created = False
              success = False
              result = 1
              try:
                  status, repository = request("GET", "")
                  if status != 200:
                      print("RESULT: target repository lookup denied or unavailable; HTTP", status)
                      return 4
                  default_branch = repository.get("default_branch", "")
                  if not re.fullmatch(r"[A-Za-z0-9._/-]+", default_branch):
                      print("RESULT: invalid target default branch")
                      return 3
                  status, base = request("GET", "/git/ref/heads/" + default_branch)
                  if status != 200 or base.get("object", {}).get("type") != "commit":
                      print("RESULT: target base commit unavailable; HTTP", status)
                      return 4
                  sha = base["object"].get("sha", "")
                  if not re.fullmatch(r"[0-9a-f]{40}", sha):
                      print("RESULT: invalid target commit identity")
                      return 3
                  status, _ = request("GET", "/git/ref/heads/" + branch)
                  if status != 404:
                      print("RESULT: probe ref already exists or absence cannot be established; HTTP", status)
                      return 5
                  status, reference = request("POST", "/git/refs", {"ref": "refs/heads/" + branch, "sha": sha})
                  if status != 201:
                      print("RESULT: branch creation was not confirmed; HTTP", status)
                      return 6
                  created = True
                  if reference.get("ref") != "refs/heads/" + branch or reference.get("object", {}).get("sha") != sha:
                      print("RESULT: created ref response did not match request")
                      result = 7
                  else:
                      success = True
                      result = 0
                      print("WRITE VERIFIED: RELEASE_TOKEN created", branch, "at existing commit", sha)
              except Exception:
                  print("RESULT: transport or protocol failure; inspect probe ref before retry:", branch)
                  result = 8
              finally:
                  if created:
                      try:
                          status, _ = request("DELETE", ref_path)
                          if status == 204:
                              print("CLEANUP VERIFIED: removed own probe ref", branch)
                          else:
                              print("CLEANUP UNCONFIRMED: HTTP", status, "ref", branch)
                              result = 9
                      except Exception:
                          print("CLEANUP UNCONFIRMED: transport failure; ref", branch)
                          result = 9
              if success and result == 0:
                  print("RESULT: write and cleanup passed; protected-branch writes were not tested")
              return result
          
          
          if __name__ == "__main__":
              sys.exit(run())
          PYTHON
