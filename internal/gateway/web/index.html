<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smidja web</title>
<style>
:root {
  color-scheme: light dark;
  font-family: system-ui, sans-serif;
}
body {
  margin: 0;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
header {
  display: flex;
  align-items: baseline;
  gap: 1rem;
  padding: 0.5rem 1rem;
  border-bottom: 1px solid #8884;
}
h1 { font-size: 1.1rem; margin: 0; }
h2 { font-size: 0.9rem; margin: 0 0 0.5rem; }
main {
  flex: 1;
  display: flex;
  min-height: 0;
}
aside {
  width: 14rem;
  border-right: 1px solid #8884;
  padding: 1rem;
  overflow-y: auto;
}
section {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.transcript {
  flex: 1;
  overflow-y: auto;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.message { border: 1px solid #8884; border-radius: 0.5rem; padding: 0.5rem; }
.message .who { font-size: 0.75rem; opacity: 0.7; }
.message .body { white-space: pre-wrap; word-break: break-word; }
.composer {
  border-top: 1px solid #8884;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.actions { display: flex; gap: 0.5rem; }
textarea { width: 100%; resize: vertical; }
button, select, input {
  font: inherit;
  padding: 0.3rem 0.6rem;
}
.status { font-size: 0.8rem; opacity: 0.8; }
.status.err { color: #c33; }
#login {
  margin: auto;
  padding: 2rem;
}
#login form { display: flex; gap: 0.5rem; }
</style>
</head>
<body>
<div id="login" hidden>
  <h1>smidja</h1>
  <form id="loginForm">
    <label for="loginToken">token</label>
    <input id="loginToken" type="password" autocomplete="current-password">
    <button id="loginBtn" type="button">sign in</button>
  </form>
</div>
<div id="app" hidden>
  <header>
    <h1>smidja</h1>
    <span id="status" class="status"></span>
  </header>
  <main>
    <aside>
      <h2>sessions</h2>
      <div id="sessionList"></div>
    </aside>
    <section>
      <div id="transcript" class="transcript"></div>
      <div class="composer">
        <div class="actions">
          <select id="workspace" aria-label="workspace"></select>
          <button id="cancelBtn" type="button">cancel</button>
          <button id="sendBtn" type="button">send</button>
        </div>
        <textarea id="text" rows="3" placeholder="message"></textarea>
      </div>
    </section>
  </main>
</div>
<script src="/app.js" defer></script>
</body>
</html>
